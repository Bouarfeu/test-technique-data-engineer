x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
  # Connexion Spark : mode local pour l'instant, passer à spark://spark-master:7077 plus tard
  AIRFLOW_CONN_SPARK_LOCAL: '{"conn_type": "spark", "host": "local[*]"}'
  # Accès au stockage objet (S3-compatible) pour les jobs Spark et les tâches Python
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  # Ingestion SODA : dataset, token optionnel (anti-throttling), plafond de lignes par jour (0 = tout)
  SODA_DATASET_ID: ${SODA_DATASET_ID:-wrvz-psew}
  SODA_APP_TOKEN: ${SODA_APP_TOKEN:-}
  SODA_MAX_ROWS_PER_DAY: ${SODA_MAX_ROWS_PER_DAY:-0}
  # Période traitée (jours inclus). Par défaut, aucun run automatique : chargement via backfill (PIPELINE_CATCHUP=true pour un lancement auto)
  PIPELINE_START_DATE: ${PIPELINE_START_DATE:-2022-07-01}
  PIPELINE_END_DATE: ${PIPELINE_END_DATE:-2022-09-30}
  PIPELINE_CATCHUP: ${PIPELINE_CATCHUP:-false}
  # Ressources Spark : défauts prudents (8 Go de RAM). Avec 16 Go+, passer SPARK_MAX_PARALLEL_JOBS à 2 ou 3
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
  SPARK_MAX_PARALLEL_JOBS: ${SPARK_MAX_PARALLEL_JOBS:-1}

x-minio-image: &minio-image pgsty/silo:RELEASE.2026-10-15T00-00-00Z

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  minio:
    image: *minio-image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/bronze local/silver local/gold
      "

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    # standalone = db migrate + api-server + scheduler + dag-processor + triggerer dans un seul conteneur
    command: standalone
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  dashboard:
    build: ./dashboard
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports:
      - "8501:8501"   # dashboard BI : http://localhost:8501
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data: